# verdikt example configuration — copy to verdikt.yaml and adjust.
# Covers every judge type, every execution mode, and pipelines.
# API keys are read from environment variables via ${VAR} interpolation;
# never put raw keys in this file.

providers:
  anthropic:
    api_key: ${ANTHROPIC_AGENT_API_KEY}
  gemini:
    api_key: ${GEMINI_API_KEY}
  # custom / self-hosted endpoint speaking the Anthropic or Gemini wire
  # protocol (a compatible gateway, proxy, etc.):
  # myhost:
  #   api_key: ${MYHOST_API_KEY}
  #   base_url: "http://localhost:8000"
  #   protocol: anthropic          # anthropic | gemini

cache_path: .verdikt_cache.json   # optional: identical calls are never paid twice
max_retries: 3

judges:
  # ---- pointwise: score one output ----------------------------------------
  - name: helpfulness
    type: pointwise
    model: gemini/${GEMINI_AGENT_MODEL}
    criteria:
      - "Directly answers the question"
      - "No factual errors"
    scale: {min: 1, max: 5}
    threshold: 0.7
    samples: 3                    # multi-sample voting: 3 runs, median wins

  # ---- pointwise: same as above, on Claude instead ------------------------
  - name: judge-2
    type: pointwise
    model: anthropic/${ANTHROPIC_AGENT_MODEL}
    criteria:
      - "Directly answers the question"
      - "No factual errors"
    threshold: 0.7

  # ---- reference: compare against a gold answer ---------------------------
  - name: correctness
    type: reference
    model: anthropic/claude-sonnet-4-5
    threshold: 0.8

  # ---- pairwise: A vs B (needs candidates: [a, b] in EvalInput) -----------
  - name: ab_test
    type: pairwise
    model: gemini/gemini-2.5-pro
    criteria: ["More helpful", "More accurate"]
    position_swap: true           # run both orders; disagreement -> tie

  # ---- rubric: G-Eval style per-criterion grading -------------------------
  - name: support_quality
    type: rubric
    model: gemini/gemini-2.5-pro
    criteria:
      - "Resolves the customer's actual problem"
      - "Tone is professional and empathetic"
      - "No policy violations"
    threshold: 0.7

  # ---- classifier: fixed label set ----------------------------------------
  - name: safety
    type: classifier
    model: anthropic/claude-haiku
    labels: [safe, needs_review, unsafe]
    fail_on: [unsafe]

  # ---- RAG judges ---------------------------------------------------------
  - name: grounded
    type: rag_faithfulness        # needs context in EvalInput
    model: anthropic/claude-haiku
    threshold: 0.8
  - name: ctx_relevance
    type: rag_context_relevance   # needs input + context
    model: anthropic/claude-haiku
  - name: ans_relevance
    type: rag_answer_relevance    # needs input
    model: anthropic/claude-haiku

  # ---- trajectory: judge a full agent run (needs trajectory in EvalInput) -
  - name: agent_run
    type: trajectory
    model: anthropic/claude-sonnet-4-5
    criteria: ["Task completed", "Tool calls correct and necessary", "No redundant loops"]
    threshold: 0.7

  # ---- execution mode: broadcast + average --------------------------------
  - name: quality_panel
    type: pointwise
    threshold: 0.7
    execution:
      mode: broadcast
      models: [anthropic/claude-sonnet-4-5, anthropic/claude-haiku, gemini/gemini-2.5-pro]
      consensus: average          # default for score judges

  # ---- execution mode: broadcast + weighted_average -----------------------
  - name: weighted_panel
    type: pointwise
    execution:
      mode: broadcast
      models: [anthropic/claude-sonnet-4-5, gemini/gemini-2.5-pro]
      consensus: weighted_average
      weights:
        anthropic/claude-sonnet-4-5: 3.0
        gemini/gemini-2.5-pro: 1.0

  # ---- execution mode: broadcast + majority_vote (classifier jury) --------
  - name: safety_jury
    type: classifier
    labels: [safe, unsafe]
    fail_on: [unsafe]
    execution:
      mode: broadcast
      models: [anthropic/claude-haiku, anthropic/claude-sonnet-4-5, gemini/gemini-2.5-flash]
      # consensus omitted -> majority_vote (default for classifier/pairwise)

  # ---- execution mode: broadcast + unanimous (strict gate) ----------------
  - name: strict_safety
    type: classifier
    labels: [safe, unsafe]
    fail_on: [unsafe]
    execution:
      mode: broadcast
      models: [anthropic/claude-sonnet-4-5, gemini/gemini-2.5-pro]
      consensus: unanimous        # any split verdict -> passed = false

  # ---- execution mode: broadcast + consensus_leader -----------------------
  - name: led_panel
    type: pointwise
    execution:
      mode: broadcast
      models: [anthropic/claude-sonnet-4-5, anthropic/claude-haiku, gemini/gemini-2.5-pro]
      consensus: consensus_leader
      leader: anthropic/claude-sonnet-4-5
      on_disagreement: accept_leader   # accept_consensus | accept_leader | fail | escalate
      disagreement_threshold: 0.25

  # ---- execution mode: judge_of_judges (meta-judge) -----------------------
  - name: final_review
    type: rubric
    criteria: ["Factually correct", "Complete"]
    threshold: 0.7
    execution:
      mode: judge_of_judges
      models: [anthropic/claude-sonnet-4-5, anthropic/claude-haiku, gemini/gemini-2.5-pro]
      meta_judge: anthropic/claude-sonnet-4-5

pipelines:
  # gate -> quality panel -> meta review; later judges see earlier verdicts
  - name: support_bot_eval
    steps:
      - judge: safety
        on_fail: stop             # unsafe output: skip the expensive judges
      - judge: quality_panel
      - judge: final_review
        run_if: quality_panel.score < 0.9   # only re-check borderline cases
    aggregation: all_pass

  # parallel RAG checks combined by weighted average
  - name: rag_eval
    steps:
      - parallel: [grounded, ctx_relevance, ans_relevance]
    aggregation: weighted_average
    weights: {grounded: 2.0, ctx_relevance: 1.0, ans_relevance: 1.0}
    threshold: 0.7
