[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdikt"
version = "0.1.0"
description = "Configurable LLM-as-judge library: pluggable judges, multi-model broadcast, consensus, and resumable pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["verdikt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
